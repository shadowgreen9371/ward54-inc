name: Deploy to GitHub Pages

# Deploys index.html + admin.html (and any other static assets at the repo root)
# to GitHub Pages on every push to main. The Next.js monorepo under apps/ and
# packages/ is intentionally excluded — those deploy to Vercel separately.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'CNAME'
      - '.nojekyll'
      - 'data/**'                 # voter JSON + cms.json must trigger a deploy
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp admin.html _site/
          touch _site/.nojekyll
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f README.md ] && cp README.md _site/ || true
          # Copy the data/ tree EXCEPT the source PDFs (those are gitignored
          # but defensive copy in case anyone unpins them). Includes:
          #   data/cms/cms.json        — committee + main-page CMS data
          #   data/voters/part-NN.json — OCR-extracted voter rolls per part
          #   data/voters/manifest.json
          if [ -d data ]; then
            mkdir -p _site/data
            # Walk subdirs explicitly to skip data/pdfs/ (large source PDFs)
            for sub in data/*/; do
              name=$(basename "$sub")
              if [ "$name" != "pdfs" ] && [ "$name" != "ocr-text" ]; then
                cp -R "$sub" "_site/data/"
              fi
            done
          fi
          echo "Staged tree:"
          find _site -maxdepth 3 -type f | sort | head -50
          echo "Total files in _site:"
          find _site -type f | wc -l

      # Pinned to v4 — the v5 tarball had CDN issues on the previous run.
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
